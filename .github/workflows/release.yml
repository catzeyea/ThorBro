# Builds ThorBro for Windows, Linux and macOS and attaches everything to a GitHub release.
# Trigger: push a tag, e.g.  git tag v0.2.0 && git push origin v0.2.0
# The release is created as a draft – review it on GitHub, then publish.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Create draft release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "ThorBro $TAG" --generate-notes

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The Windows scrcpy build ships adb.exe too – both go into tools\
      # Pinned version, checked against the SHA256SUMS.txt of the same scrcpy release.
      - name: Fetch scrcpy + adb
        shell: pwsh
        env:
          SCRCPY_VERSION: v5.0.1
        run: |
          $name = "scrcpy-win64-$env:SCRCPY_VERSION.zip"
          gh release download $env:SCRCPY_VERSION -R Genymobile/scrcpy --pattern $name --pattern SHA256SUMS.txt
          $expected = @(Get-Content SHA256SUMS.txt |
            Where-Object { $_ -match "^[0-9a-fA-F]{64}\s+\*?$([regex]::Escape($name))$" } |
            ForEach-Object { ($_ -split '\s+')[0].ToLower() } |
            Select-Object -Unique)
          if ($expected.Count -ne 1) { throw "No unique SHA256 for $name in SHA256SUMS.txt" }
          $actual = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected[0]) { throw "SHA256 mismatch for ${name}: expected $($expected[0]), got $actual" }
          Write-Host "SHA256 OK: $actual  $name"
          Expand-Archive $name -DestinationPath scrcpy-tmp
          $inner = Get-ChildItem scrcpy-tmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force tools | Out-Null
          Copy-Item "$($inner.FullName)\*" tools -Recurse
          Get-ChildItem tools

      - name: Build installer
        shell: pwsh
        run: |
          Set-Content tauri.tools.json '{ "bundle": { "resources": ["tools/*", "LICENSE", "THIRD-PARTY-NOTICES.txt"] } }'
          npx --yes @tauri-apps/cli@2 build --bundles nsis --config tauri.tools.json

      - name: Pack portable ZIP
        shell: pwsh
        run: |
          $v = "$env:TAG".TrimStart("v")
          $dir = "ThorBro-$v-windows-portable"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target\release\thorbro.exe "$dir\ThorBro.exe"
          Copy-Item tools $dir -Recurse
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.txt $dir
          Compress-Archive $dir "$dir.zip"

      - name: Upload
        shell: pwsh
        run: |
          $files = @(Get-ChildItem target\release\bundle\nsis\*.exe) + @(Get-Item ThorBro-*-windows-portable.zip)
          gh release upload "$env:TAG" $files.FullName --clobber

  linux:
    needs: create-release
    # Older Ubuntu = the AppImage also runs on older distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage,deb,rpm
      - name: Upload
        run: |
          gh release upload "$TAG" \
            target/release/bundle/appimage/*.AppImage \
            target/release/bundle/deb/*.deb \
            target/release/bundle/rpm/*.rpm --clobber

  macos:
    needs: create-release
    runs-on: macos-latest
    # macOS is untested – a failure here does not block the other downloads
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build --bundles dmg
      - name: Upload
        run: gh release upload "$TAG" target/release/bundle/dmg/*.dmg --clobber

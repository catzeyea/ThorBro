[package]
name = "thorbro"
version = "0.3.0"
edition = "2021"
description = "ThorBro – files, games and save sync between your PC and the AYN Thor"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
md-5 = "0.10"
walkdir = "2"
dirs = "6"
chrono = "0.4"
tempfile = "3"
filetime = "0.2"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }
sevenz-rust = "0.6"
tar = "0.4"
flate2 = "1"
drag = "2.1.1"
# Stream PC games tab (src/pcstream/): Sunshine's HTTP(S) APIs, /serverinfo XML, PC addresses,
# Basic auth and the OS keychain for the Sunshine login.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
roxmltree = "0.21"
if-addrs = "0.15"
base64 = "0.22"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
